name: Publicar dashboard Cloudflare

on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Wrangler
        run: npm install --global wrangler
      - name: Validar secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_INGEST_TOKEN: ${{ secrets.CLOUDFLARE_INGEST_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta CLOUDFLARE_API_TOKEN"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta CLOUDFLARE_ACCOUNT_ID"; exit 1)
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || (echo "Falta CLOUDFLARE_D1_DATABASE_ID"; exit 1)
          test -n "$CLOUDFLARE_INGEST_TOKEN" || (echo "Falta CLOUDFLARE_INGEST_TOKEN"; exit 1)
      - name: Configurar ID do D1
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: sed -i "s/REPLACE_AFTER_D1_CREATE/$CLOUDFLARE_D1_DATABASE_ID/" wrangler.toml
      - name: Aplicar schema no D1
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute precos-hardware --remote --file=schema.sql
      - name: Configurar token secreto do Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_INGEST_TOKEN: ${{ secrets.CLOUDFLARE_INGEST_TOKEN }}
        run: printf '%s' "$CLOUDFLARE_INGEST_TOKEN" | npx wrangler secret put INGEST_TOKEN
      - name: Publicar Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
