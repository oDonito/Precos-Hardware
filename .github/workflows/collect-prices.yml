name: Coletar preços do radar

on:
  schedule:
    # 08:00 em Brasília (UTC-3) durante o horário padrão.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Coletar preços via SerpAPI
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python collector.py
      - name: Publicar observações como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: observacoes-${{ github.run_id }}
          path: observations.jsonl
          if-no-files-found: warn
          retention-days: 30
      - name: Enviar observações ao Cloudflare Worker
        if: ${{ hashFiles('observations.jsonl') != '' }}
        env:
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          CLOUDFLARE_INGEST_TOKEN: ${{ secrets.CLOUDFLARE_INGEST_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          path = 'observations.jsonl'
          records = [json.loads(line) for line in open(path, encoding='utf-8') if line.strip()]
          if not records:
              print('Nenhuma observação encontrada; nada para enviar.')
              raise SystemExit(0)
          url = os.environ['CLOUDFLARE_WORKER_URL'].rstrip('/') + '/api/observations'
          body = json.dumps({'collection': 'observations', 'records': records}).encode('utf-8')
          request = urllib.request.Request(url, data=body, headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_INGEST_TOKEN']}, method='POST')
          with urllib.request.urlopen(request, timeout=60) as response:
              print(response.read().decode('utf-8'))
          PY
