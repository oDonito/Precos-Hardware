name: Coletar preços do radar

on:
  schedule:
    # 08:00 em Brasília (UTC-3) durante o horário padrão.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Recuperar histórico dos snapshots versionados
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          merged = {}
          commits = subprocess.check_output(
              ['git', 'log', '--format=%H', '--', 'data/observations.json'],
              text=True,
          ).splitlines()
          for commit in commits:
              result = subprocess.run(
                  ['git', 'show', f'{commit}:data/observations.json'],
                  text=True, capture_output=True,
              )
              if result.returncode != 0:
                  continue
              try:
                  payload = json.loads(result.stdout)
              except json.JSONDecodeError:
                  continue
              for observation in payload.get('observations', []):
                  if observation.get('id'):
                      merged[observation['id']] = observation
          current = Path('data/observations.json')
          payload = json.loads(current.read_text(encoding='utf-8')) if current.exists() else {}
          for observation in payload.get('observations', []):
              if observation.get('id'):
                  merged[observation['id']] = observation
          rows = sorted(merged.values(), key=lambda row: (row.get('collectedAt', ''), row.get('id', '')))
          generated_at = payload.get('generatedAt')
          current.write_text(json.dumps({'generatedAt': generated_at, 'observations': rows}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          dates = sorted({row.get('collectedAt', '')[:10] for row in rows if row.get('collectedAt')})
          print(f'Histórico recuperado: {len(rows)} observações em {dates}')
          PY
      - name: Validar secret SerpAPI
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          test -n "$SERPAPI_API_KEY"
          python - <<'PY'
          import os, sys, urllib.parse, urllib.request
          key = os.environ['SERPAPI_API_KEY'].strip()
          url = 'https://serpapi.com/account.json?' + urllib.parse.urlencode({'api_key': key})
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = response.read().decode('utf-8')
          except Exception as exc:
              print(f'Falha ao validar SERPAPI_API_KEY: {type(exc).__name__}', file=sys.stderr)
              raise SystemExit(1)
          if 'error' in payload.lower() or 'unauthorized' in payload.lower():
              print('SERPAPI_API_KEY foi rejeitada pela SerpAPI.', file=sys.stderr)
              raise SystemExit(1)
          print('SERPAPI_API_KEY aceita pela SerpAPI; conteúdo da resposta não será exibido.')
          PY
      - name: Coletar preços via SerpAPI
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python collector.py
      - name: Verificar preservação do histórico
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/observations.json').read_text(encoding='utf-8'))
          observations = payload.get('observations', [])
          dates = sorted({row.get('collectedAt', '')[:10] for row in observations if row.get('collectedAt')})
          print(f'Snapshot contém {len(observations)} observações em {dates}')
          if not observations:
              raise SystemExit('Snapshot sem observações; publicação bloqueada.')
          PY
      - name: Atualizar snapshot histórico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations.json
          git diff --cached --quiet || git commit -m "Atualizar snapshot de preços"
          git push
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar dashboard
        run: |
          mkdir -p _site/data
          cp -R docs/. _site/
          cp data/items.json data/observations.json _site/data/
      - name: Fazer upload do dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publicar observações como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: observacoes-${{ github.run_id }}
          path: observations.jsonl
          if-no-files-found: warn
          retention-days: 30
